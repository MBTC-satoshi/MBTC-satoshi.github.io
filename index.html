<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemeBitcoin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Pixelify Sans',monospace;background:#6d9293;display:flex;align-items:center;justify-content:center;padding:20px;}
.window{width:100%;max-width:340px;background:#fff;border:2px solid #000;box-shadow:4px 4px 0 #000;}
.titlebar{height:24px;border-bottom:2px solid #000;display:flex;align-items:center;padding:0 6px;position:relative;background:repeating-linear-gradient(#000 0 1px,#fff 1px 3px);}
.closebox{width:13px;height:13px;border:2px solid #000;background:#fff;}
.title{position:absolute;left:50%;transform:translateX(-50%);background:#fff;padding:0 10px;font-weight:700;font-size:14px;}
.body{padding:30px 22px 32px;text-align:center;}
.logo{width:76px;height:76px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;margin:0 auto;}
h1{font-size:24px;margin:16px 0 8px;}
p{font-size:15px;color:#333;line-height:1.6;}
.btn{display:inline-block;margin-top:26px;background:#000;color:#fff;font-family:inherit;font-weight:700;font-size:16px;padding:14px 24px;border:2px solid #000;border-radius:12px;box-shadow:0 0 0 3px #fff,0 0 0 5px #000;text-decoration:none;}
</style>
</head>
<body>
<div class="window">
<div class="titlebar"><div class="closebox"></div><div class="title">MemeBitcoin</div></div>
<div class="body">
<div class="logo">₿</div>
<h1>MemeBitcoin</h1>
<p>Open the site in your browser<br>to connect your wallet.</p>
<a id="btn" class="btn" href="#" target="_blank" rel="noopener">Open in Browser →</a>
</div>
</div>
<script>
var DEFAULT="https://www.memebitcoin.org";
function safe(u){try{var h=new URL(u);if(h.protocol==="https:"&&(h.hostname==="memebitcoin.org"||h.hostname.endsWith(".memebitcoin.org")))return u;}catch(e){}return DEFAULT;}
var raw=new URLSearchParams(location.search).get("url");
var url=raw?safe(raw):DEFAULT;
var tg=window.Telegram&&window.Telegram.WebApp;
var btn=document.getElementById("btn");
btn.href=url;
btn.addEventListener("click",function(e){if(tg&&typeof tg.openLink==="function"){e.preventDefault();tg.openLink(url);}});
if(tg)tg.ready();
</script>
</body>
</html>
