<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemeBitcoin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:48px 20px;color:#222;">
<h3>Opening MemeBitcoin…</h3>
<p><a id="go" href="#">Tap here if it doesn't open</a></p>
<script>
var DEFAULT = "https://www.memebitcoin.org";
function safe(u){try{var h=new URL(u);if(h.protocol==="https:"&&(h.hostname==="memebitcoin.org"||h.hostname.endsWith(".memebitcoin.org")))return u;}catch(e){}return DEFAULT;}
var raw = new URLSearchParams(location.search).get("url");
var url = raw ? safe(raw) : DEFAULT;
var tg = window.Telegram && window.Telegram.WebApp;
function go(){ if(tg){tg.openLink(url);} else {window.location.href=url;} }
var link=document.getElementById("go");
link.href=url;
link.onclick=function(e){e.preventDefault();go();};
if(tg)tg.ready();
go();
</script>
</body>
</html>
